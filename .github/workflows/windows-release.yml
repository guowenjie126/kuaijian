name: Windows Release

on:
  push:
    branches: [main]
    paths:
      - "kuaijian-winui/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Windows 版本号，例如 0.4.1；留空时读取 installer.iss"
        required: false
        type: string
      notes:
        description: "本次更新说明"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $installer = Get-Content -Raw -LiteralPath "kuaijian-winui/installer.iss"
            $match = [regex]::Match($installer, '#define\s+MyAppVersion\s+"(?<version>[^" ]+)"')
            if (-not $match.Success) { throw "无法从 kuaijian-winui/installer.iss 读取版本号。" }
            $version = $match.Groups['version'].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本号必须是 major.minor.patch，例如 0.4.1。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=win-v$version" >> $env:GITHUB_OUTPUT

      - name: Skip an already published version
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; bump the Windows version to publish a new update."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows x64 installer
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: .\kuaijian-winui\build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create release manifest
        if: steps.existing.outputs.skip != 'true'
        id: manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          $installerPath = Join-Path $env:GITHUB_WORKSPACE "kuaijian-winui/installer/KuaiJian-$env:RELEASE_VERSION-Windows-x64-Setup.exe"
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "没有找到安装包：$installerPath"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath).Hash.ToLowerInvariant()
          $downloadUrl = "https://kuaijian.jingronghao.com/downloads/KuaiJian-$env:RELEASE_VERSION-Windows-x64-Setup.exe"
          $notes = if ([string]::IsNullOrWhiteSpace($env:INPUT_NOTES)) { "Windows x64 自动构建版本 $env:RELEASE_VERSION" } else { $env:INPUT_NOTES }
          $manifest = [ordered]@{
            platform = "windows-x64"
            version = $env:RELEASE_VERSION
            downloadURL = $downloadUrl
            sha256 = $hash
            notes = $notes
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          "installer=$installerPath" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          INSTALLER_PATH: ${{ steps.manifest.outputs.installer }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
        run: |
          $notes = if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) { "Windows x64 自动构建版本 $env:RELEASE_VERSION" } else { $env:RELEASE_NOTES }
          gh release create $env:RELEASE_TAG $env:INSTALLER_PATH $env:MANIFEST_PATH `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "快剪 Windows v$env:RELEASE_VERSION" `
            --notes $notes
